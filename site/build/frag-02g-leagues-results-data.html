function openResultsModal(league, weekNum) {
  var data = window.S1_RESULTS[league] && window.S1_RESULTS[league][weekNum];
  if (!data) return;
  var hasResults = data.practice || data.quali || data.race1 || data.race2;
  var html = '';
  html += '<div style="background:#0d0d0d;border-bottom:1px solid #2a2a2a;padding:22px 28px;display:flex;justify-content:space-between;align-items:center;">';
  html += '<div>';
  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:0.7em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#EF4444;margin-bottom:4px;">Week ' + weekNum + ' &middot; ' + data.date + '</div>';
  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:1.8em;font-weight:900;text-transform:uppercase;color:white;line-height:1;">' + data.track + '</div>';
  html += '</div>';
  html += '<button onclick="closeResultsModal()" style="background:none;border:1px solid #444;color:#ccc;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:1.2em;display:flex;align-items:center;justify-content:center;flex-shrink:0;">&#x2715;</button>';
  html += '</div>';
  if (!hasResults) {
    html += '<div style="padding:40px 28px;text-align:center;">';
    html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:1.1em;color:#666;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;">Detailed results coming soon</div>';
    html += '<a href="https://www.youtube.com/@SIM1Racing" target="_blank" rel="noopener" style="font-family:\'Barlow\',sans-serif;font-size:0.9em;color:#EF4444;text-decoration:none;">Watch replay on YouTube &rarr;</a>';
    html += '</div>';
  } else {
    html += '<div style="padding:20px 24px;display:flex;flex-direction:column;gap:24px;">';
    if (data.practice) { html += buildResultTable('Practice Results', data.practice.headers, data.practice.rows, null); }
    if (data.quali) { html += buildResultTable('Qualifying Results', data.quali.headers, data.quali.rows, null); }
    if (data.race1) { html += buildResultTable(data.race1.label + ' Results', data.race1.headers, data.race1.rows, data.race1.fl); }
    if (data.race2) { html += buildResultTable(data.race2.label + ' Results', data.race2.headers, data.race2.rows, data.race2.fl); }
    html += '</div>';
  }
  document.getElementById('resultsModalContent').innerHTML = html;
  document.getElementById('resultsModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function buildResultTable(title, headers, rows, flData) {
  var carIdx = headers.indexOf('Car');
  var hh = carIdx >= 0 ? headers.filter(function(_,i){return i!==carIdx;}) : headers.slice();
  var rr = rows.map(function(r){ return carIdx >= 0 ? r.filter(function(_,i){return i!==carIdx;}) : r.slice(); });
  function colWidth(h) {
    if (h==='Pos') return '40px'; if (h==='Driver') return ''; if (h==='Laps') return '52px';
    if (h==='Time') return '106px'; if (h==='Gap') return '106px'; if (h==='Lap') return '44px';
    if (h==='S1'||h==='S2'||h==='S3') return '74px'; return '80px';
  }
  function makeTable(hdrs, dataRows, small) {
    var sz = small ? 0.88 : 1;
    var t = '<div style="overflow-x:auto;-webkit-overflow-scrolling:touch;">';
    t += '<table style="width:100%;border-collapse:collapse;background:#0d0d0d;border:1px solid #1e1e1e;border-radius:10px;overflow:hidden;">';
    t += '<colgroup>'; hdrs.forEach(function(h){ var w=colWidth(h); t += w ? '<col style="width:'+w+'">' : '<col>'; }); t += '</colgroup>';
    t += '<thead><tr style="background:#0a0a0a;">';
    hdrs.forEach(function(h,i){
      var isLast = i===hdrs.length-1; var align = i>=2 ? 'text-align:right;' : '';
      var border = isLast ? '' : 'border-right:1px solid #1e1e1e;';
      var pad = i===0 ? 'padding:9px 10px 9px 14px;' : (isLast ? 'padding:9px 14px 9px 10px;' : 'padding:9px 10px;');
      t += '<th style="font-family:\'Barlow Condensed\',sans-serif;font-size:'+(0.65*sz)+'em;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:#777;white-space:nowrap;border-bottom:1px solid #1a1a1a;'+align+border+pad+'">'+h+'</th>';
    });
    t += '</tr></thead><tbody>';
    dataRows.forEach(function(row,ri){
      var posColor = row[0]==='1'?'#ffce4a':row[0]==='2'?'#c8cfd6':row[0]==='3'?'#e0954d':'#999';
      var rowBorder = ri<dataRows.length-1 ? 'border-bottom:1px solid #161616;' : '';
      t += '<tr style="'+rowBorder+'">';
      row.forEach(function(cell,ci){
        var isLast = ci===row.length-1; var border = isLast ? '' : 'border-right:1px solid #1e1e1e;'; var align = ci>=2 ? 'text-align:right;' : '';
        var pad = ci===0 ? 'padding:10px 10px 10px 14px;' : (isLast ? 'padding:10px 14px 10px 10px;' : 'padding:10px;');
        var style;
        if (ci===0) style='font-family:\'Barlow Condensed\',sans-serif;font-size:'+(1.05*sz)+'em;font-weight:900;color:'+posColor+';'+border+pad;
        else if (ci===1) style='font-family:\'Barlow Condensed\',sans-serif;font-size:'+(0.92*sz)+'em;font-weight:700;color:white;'+border+pad;
        else style='font-family:\'Barlow\',sans-serif;font-size:'+(0.82*sz)+'em;color:#aaa;'+align+border+pad;
        t += '<td style="'+style+'">'+cell+'</td>';
      });
      t += '</tr>';
    });
    t += '</tbody></table></div>';
    return t;
  }
  var html = '<div style="margin-bottom:4px;">';
  html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:0.78em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#EF4444;margin-bottom:8px;">'+title+'</div>';
  html += makeTable(hh, rr, false);
  if (flData) {
    var fcIdx = flData.headers.indexOf('Car');
    var fh = fcIdx>=0 ? flData.headers.filter(function(_,i){return i!==fcIdx;}) : flData.headers.slice();
    var fr = flData.rows.map(function(r){ return fcIdx>=0 ? r.filter(function(_,i){return i!==fcIdx;}) : r.slice(); });
    html += '<div style="margin-top:10px;">';
    html += '<div style="font-family:\'Barlow Condensed\',sans-serif;font-size:0.62em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:6px;">Fastest Laps</div>';
    html += makeTable(fh, fr, true);
    html += '</div>';
  }
  html += '</div>';
  return html;
}
function closeResultsModal() {
  document.getElementById('resultsModal').style.display = 'none';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeResultsModal(); });
</script>
