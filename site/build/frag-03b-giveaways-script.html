let CURRENT_G = null;

function multiplierFor(winNumber){ if (winNumber <= 1) return 1; if (winNumber === 2) return 0.5; return 0.25; }
/* NOTE: normalizeName / nameKey / isStaff / isSIM1Team and the SIM1_TEAM /
   STAFF_LIST / NAME_ALIASES constants are the canonical copies already
   defined by the Qualifiers section's script above — intentionally not
   redeclared here. */
function fmt(n){ return n.toLocaleString('en-US'); }

function computeWeek(results, priorWins){
  const eligible = [];
  const seen = new Set();
  results.forEach((r, idx) => {
    const key = nameKey(r.driver);
    if(!key || seen.has(key)) return;
    if(isStaff(r.driver) || isSIM1Team(r.driver)) return;
    if(!r.lap) return;
    seen.add(key);
    eligible.push({ key, driver:normalizeName(r.driver), rawPos:idx+1, lap:r.lap, laps:r.laps, gap:r.gap });
  });
  let slot = 0;
  const winners = [];
  for(let i = 0; i < eligible.length; i++){
    if(slot >= SLOTS) break;
    const e = eligible[i];
    const position = i + 1;
    const winNumber = (priorWins[e.key]||0) + 1;
    if(winNumber === 1){
      winners.push({ ...e, position, tier:slot+1, winNumber, mult:1, base:PRIZES[slot], entries:PRIZES[slot], repeat:false });
      slot += 1;
    } else {
      if(position > SLOTS) continue;
      const mult = multiplierFor(winNumber);
      const base = PRIZES[position-1];
      winners.push({ ...e, position, tier:position, winNumber, mult, base, entries:Math.round(base*mult), repeat:true });
    }
  }
  return winners;
}
function computeAll(giveaway){
  const g = giveaway || CURRENT_G;
  if(!g) return { weekResults: [], totals: {} };
  const priorWins = {};
  const weekResults = [];
  const totals = {};
  g.weeks.forEach((w, wi) => {
    const winners = computeWeek(w.results || [], priorWins);
    winners.forEach(x => {
      priorWins[x.key] = (priorWins[x.key]||0) + 1;
      if(!totals[x.key]) totals[x.key] = { name:x.driver, total:0, perWeek:new Array(g.weeks.length).fill(0) };
      totals[x.key].total += x.entries;
      totals[x.key].perWeek[wi] += x.entries;
    });
    weekResults.push(winners);
  });
  return { weekResults, totals };
}

  document.getElementById('build-facts').textContent = g.build.facts;
  document.getElementById('build-highlights').innerHTML = g.build.highlights.map(h => `<li style="font-family:var(--body);font-size:0.82em;color:#bbb;line-height:1.45;padding-left:15px;position:relative;">${h}</li>`).join('');
  document.getElementById('build-eyebrow').textContent = 'BY ' + (g.partner||'').split('×')[0].trim().toUpperCase();
}

function winBadge(winNumber){
  const map = {1:['1st Win · 100%','#22c55e'],2:['2nd Win · 50%','#fbbf24'],3:['3rd Win · 25%','#fb923c'],4:['4th Win · 25%','#EF4444']};
  const [txt,col] = map[Math.min(winNumber,4)] || map[4];
  return `<span class="win-badge" style="background:${col}1f;color:${col};border:1px solid ${col}55;">${txt}</span>`;
}
function teamTag(name){ return isSIM1Team(name) ? `<span class="tag-sim1">SIM1</span>` : ''; }
const HEAD = `<thead><tr>
  <th class="col-pos">Pos</th><th>Driver</th>
  <th class="col-r">Best Lap</th><th class="col-r">Laps</th><th class="col-r">Gap</th><th class="col-r">Entries</th>
</tr></thead>`;
function posCell(pos){ return `<td class="col-pos"><span class="tier ${pos<=3?'top':''}">${pos<=3?['🥇','🥈','🥉'][pos-1]:'P'+pos}</span></td>`; }

function renderWeeks(data){
  const out = (CURRENT_G ? CURRENT_G.weeks : []).map((w,wi) => {
    const winners = data.weekResults[wi];
    const results = w.results || [];
    if(!results.length){
      return `<div class="wk-result"><div class="rh"> <span class="lbl">Week ${w.n}</span> <span class="ti">${w.track||'Track TBA'}</span> <span class="sub">${w.dates}</span></div>
      <div class="tbl-pad"><div class="empty-state"> <div class="e1">Results pending</div> <div class="e2">This week's standings will be posted once the week wraps.</div> </div></div></div>`;
    }
    const totalEnt = winners.reduce((s,x)=>s+x.entries,0);
    const repeats = winners.filter(x=>x.winNumber>1).length;
    const wRows = winners.map(x => {
      const detail = x.repeat ? `${x.mult*100}% × ${fmt(x.base)}` : '';
      return `<tr>
        ${posCell(x.rawPos)}
        <td><span class="drv">${x.driver}</span> ${winBadge(x.winNumber)}</td>
        <td class="col-r lap">${x.lap||'—'}</td>
        <td class="col-r mut">${x.laps!=null?x.laps:'—'}</td>
        <td class="col-r mut">${x.gap||'—'}</td>
        <td class="col-r"><div class="ent">${fmt(x.entries)}</div>${detail?`<div class="detail">${detail}</div>`:''}</td>
      </tr>`;
    }).join('');
    const winMap = {}; winners.forEach(x => winMap[x.key] = x);
    const fullRows = results.map((r,idx) => {
      const key = nameKey(r.driver);
      const win = winMap[key];
      const team = isSIM1Team(r.driver), staff = isStaff(r.driver);
      const noLap = !r.lap;
      let ent;
      if(win) ent = `<span class="ent" style="font-size:0.95em;">${fmt(win.entries)}</span>`;
      else if(team) ent = `<span class="exc">SIM1 team</span>`;
      else if(staff) ent = `<span class="exc">Staff</span>`;
      else ent = `<span class="mut">—</span>`;
      return `<tr class="${noLap?'norow':''}${win?' winrow':''}">
        <td class="col-pos mut">${idx+1}</td>
        <td><span class="drv" style="font-size:0.96em;">${normalizeName(r.driver)}</span>${teamTag(r.driver)}</td>
        <td class="col-r lap">${noLap?'<span class="mut" style="font-style:italic;">No valid lap</span>':r.lap}</td>
        <td class="col-r mut">${r.laps!=null?r.laps:'—'}</td>
        <td class="col-r mut">${noLap?'':r.gap}</td>
        <td class="col-r">${ent}</td>
      </tr>`;
    }).join('');
    return `<div class="wk-result">
      <div class="rh">
        <span class="lbl">Week ${w.n}</span> <span class="ti">${w.track||'Track TBA'}</span> <span class="sub">${w.dates}</span>
        <span class="stat"><b>${winners.length}</b> winners${repeats?` · ${repeats} repeat`:''}<br>${fmt(totalEnt)} entries awarded</span>
      </div>
      <div class="tbl-pad">
        <div class="tbl-scroll"><table>${HEAD}<tbody>${wRows}</tbody></table></div>
        <button class="full-toggle" id="ft-btn-${wi}" onclick="toggleFull(${wi})">VIEW FULL RESULTS (${results.length}) ▾</button>
        <div class="full-table" id="ft-${wi}" data-count="${results.length}" style="display:none;">
          <div class="tbl-scroll"><table>${HEAD}<tbody>${fullRows}</tbody></table></div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('weeks-out').innerHTML = out;
}
function toggleFull(wi){
  const el = document.getElementById('ft-'+wi), btn = document.getElementById('ft-btn-'+wi);
  const open = el.style.display === 'none';
  el.style.display = open ? 'block' : 'none';
  btn.textContent = open ? 'HIDE FULL RESULTS ▴' : `VIEW FULL RESULTS (${el.dataset.count}) ▾`;
}
function renderStandings(data){
  const list = Object.values(data.totals).sort((a,b)=>b.total-a.total);
  const el = document.getElementById('standings-out');
  if(!list.length){
    el.innerHTML = `<div class="empty-state"> <div class="e1">No entries yet</div> <div class="e2">Standings will appear here as each week's results are posted.</div></div>`;
    return;
  }
  const grandTotal = list.reduce((s,d)=>s+d.total,0);
  const head = `<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:18px;">
    <div class="hero-stat" style="flex:1;min-width:120px;"><div class="v">${list.length}</div><div class="l">Unique Winners</div></div>
    <div class="hero-stat" style="flex:1;min-width:120px;"><div class="v">${fmt(grandTotal)}</div><div class="l">Total Entries Awarded</div></div>
    <div class="hero-stat" style="flex:1;min-width:120px;"><div class="v">${fmt(list[0].total)}</div><div class="l">Leader's Entries</div></div>
  </div>`;
  const rows = list.map((d,i) => {
    const pos = i<3 ? ['🥇','🥈','🥉'][i] : (i+1);
    const wks = d.perWeek.map((v,wi)=>`<div class="wbox ${v?'has':''}" title="Week ${wi+1}">${v?fmt(v):'–'}</div>`).join('');
    return `<div class="row ${i===0?'top1':''}">
      <div class="pos">${pos}</div>
      <div class="nm">${d.name}${teamTag(d.name)}</div>
      <div class="wks">${wks}</div>
      <div class="tot">${fmt(d.total)}</div>
    </div>`;
  }).join('');
  el.innerHTML = head + `<div class="card standings" style="overflow:hidden;">
    <div class="row" style="background:var(--card2);">
      <div class="pos" style="font-size:0.74em;color:#777;font-family:var(--body);font-weight:700;">#</div>
      <div class="nm" style="font-size:0.74em;color:#777;letter-spacing:0.5px;">Driver</div>
      <div class="wks" style="font-family:var(--body);font-size:0.74em;color:#777;align-self:center;font-weight:700;">W1&nbsp;&nbsp; W2&nbsp;&nbsp; W3&nbsp;&nbsp; W4</div>
      <div class="tot" style="font-size:0.74em;color:#777;font-family:var(--body);font-weight:700;">Entries</div>
    </div>${rows}</div>`;
}
function renderLookup(){
  const q = (document.getElementById('lookup-input').value||'').trim().toLowerCase();
  const el = document.getElementById('lookup-out');
  if(q.length < 2){
    el.innerHTML = `<div class="empty-state"><div class="e1">Look up your entries</div> <div class="e2">Type a driver name to see their total and weekly breakdown.</div></div>`;
    return;
  }
  const data = computeAll();
  const matches = Object.values(data.totals).filter(d => d.name.toLowerCase().includes(q) || nameKey(d.name).includes(q));
  if(!matches.length){
    el.innerHTML = `<div class="empty-state"><div class="e1">No entries for "${q}"</div> <div class="e2">This driver hasn't earned entries yet — or check the spelling.</div></div>`;
    return;
  }
  el.innerHTML = matches.sort((a,b)=>b.total-a.total).map(d => {
    const wkRows = d.perWeek.map((v,wi)=>`
      <div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border2);">
        <span style="font-family:var(--body);font-weight:700;color:${v?'#fff':'#555'};font-size:0.95em;">Week ${wi+1}<span style="font-family:var(--body);font-weight:400;color:#666;font-size:0.85em;margin-left:8px;">${(CURRENT_G&&CURRENT_G.weeks[wi])?(CURRENT_G.weeks[wi].track||'TBA'):'TBA'}</span></span>
        <span style="font-family:var(--body);font-weight:800;font-size:1em;color:${v?'var(--red)':'#555'};">${v?fmt(v):'—'}</span>
      </div>`).join('');
    return `<div class="driver-card" style="margin-bottom:14px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;">
        <div class="dn">${d.name}${teamTag(d.name)}</div>
        <div style="text-align:right;"><div class="grand">${fmt(d.total)}</div><div class="grand-l">Total Entries Awarded</div></div>
      </div>${wkRows}</div>`;
  }).join('');
}

function recompute(){
  if(!CURRENT_G) return;
  const data = computeAll();
  renderStandings(data);
  renderWeeks(data);
  if(document.getElementById('gv-panel-lookup').classList.contains('active')) renderLookup();
}
function setTab(tab){
  document.querySelectorAll('#sec-giveaways .tab').forEach(t=>t.classList.toggle('active', t.dataset.tab===tab));
  document.querySelectorAll('#sec-giveaways .panel').forEach(p=>{p.classList.remove('active'); p.style.display='none';});
  const activePanel = document.getElementById('gv-panel-'+tab);
  activePanel.classList.add('active'); activePanel.style.display='block';
  if(tab==='lookup') renderLookup();
}

function navHome(e){ if(e) e.preventDefault(); if(location.hash){ history.pushState('', '', location.pathname + location.search); } route(); }
function navTo(e, id){
  if(CURRENT_G){
    e.preventDefault();
    history.pushState('', '', location.pathname + location.search + '#' + id);
    route();
    setTimeout(()=>{ const el=document.getElementById('gv-'+id) || document.getElementById(id); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); }, 30);
  }
}
function renderGiveawayArchive(){
  const html = GIVEAWAYS.slice().reverse().map(g => {
    const data = computeAll(g);
    const winners = Object.keys(data.totals).length;
    const totalEntries = Object.values(data.totals).reduce((s,d)=>s+d.total,0);
    const statusBadge = g.status==='active' ? '<span class="arch-status live">LIVE</span>' : g.status==='upcoming' ? '<span class="arch-status soon">UPCOMING</span>' : '<span class="arch-status done">COMPLETED</span>';
    return `<a class="arch-card" href="#g/${g.slug}">
      <div class="arch-photo">${g.carPhoto ? `<img src="${g.carPhoto}" alt="${g.subtitle}">` : ''}${statusBadge}</div>
      <div class="arch-body">
        <div class="arch-eyebrow">${g.partner}</div>
        <div class="arch-t">${g.subtitle}</div>
        <div class="arch-s">${g.fullName}</div>
        <div class="arch-meta">${g.period}</div>
        <div class="arch-stats">
          <span><b>${winners}</b> winners</span>
          <span><b>${fmt(totalEntries)}</b> entries</span>
          <span><b>${g.weeks.length}</b> weeks</span>
        </div>
        <div class="arch-cta">VIEW STANDINGS →</div>
      </div>
    </a>`;
  }).join('');
  document.getElementById('archive-grid').innerHTML = html || `<div class="empty-state"><div class="e1">No giveaways yet</div><div class="e2">The first one will appear here once it wraps.</div></div>`;
}
function renderGiveawayHero(g){
  document.getElementById('gv-partner').textContent = g.partner;
  document.getElementById('gv-title').innerHTML = g.subtitle.replace(/(Giveaway)$/i, '<br><span class="accent">$1</span>');
  document.getElementById('gv-sub').textContent = g.fullName + ' · ' + g.period;
  const rulesEl = document.getElementById('gv-rules');
  if(g.rulesUrl){ rulesEl.href = g.rulesUrl; rulesEl.style.display = ''; } else rulesEl.style.display = 'none';
  document.getElementById('gv-stat-weeks').textContent = g.weeks.length;
  const data = computeAll(g);
  document.getElementById('gv-stat-winners').textContent = Object.keys(data.totals).length;
  document.getElementById('gv-stat-entries').textContent = fmt(Object.values(data.totals).reduce((s,d)=>s+d.total,0));
}
function showLanding(){
  CURRENT_G = null;
  document.getElementById('view-landing').style.display = '';
  document.getElementById('view-giveaway').style.display = 'none';
  renderGiveawayArchive();
}
function showGiveaway(g){
  CURRENT_G = g;
  document.getElementById('view-landing').style.display = 'none';
  document.getElementById('view-giveaway').style.display = '';
  renderGiveawayHero(g);
  renderPhotos();
  renderBuild();
  recompute();
  setTab('standings');
}
function route(){
  const m = (location.hash||'').match(/^#g\/(.+)$/);
  if(m){ const g = GIVEAWAYS.find(x => x.slug === m[1]); if(g){ showGiveaway(g); return; } }
  showLanding();
}
/* Only react to hash changes that belong to this section's own router
   (empty hash, or #g/<slug>) — otherwise every other section's nav
   anchors (#sec-leagues, #sec-qualifiers, ...) would also force this
   section back to its landing view. */
window.addEventListener('hashchange', function(){
  if(!location.hash || /^#g\//.test(location.hash)) route();
});

/* Car Giveaway / Track Day mode toggle — Track Day is merged into this
   section as a second sub-view rather than its own top-level section. */
function gvModeTab(mode){
  const modes = ['car','trackday'];
  modes.forEach(m => {
    document.getElementById('gv-mode-' + m).style.display = (m === mode) ? '' : 'none';
    const btn = document.getElementById('gv-mode-tab-' + m);
    if(m === mode){ btn.style.background = 'var(--red)'; btn.style.color = '#fff'; }
    else { btn.style.background = 'transparent'; btn.style.color = '#888'; }
  });
  window.scrollTo(0, document.getElementById('sec-giveaways').offsetTop - 60);
}

/* INIT — giveaways section */
renderWeekCards();
renderLadder();
route();
</script>
