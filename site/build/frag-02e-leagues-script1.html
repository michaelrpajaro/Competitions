function leagueSeasonEnd(league) {
  const end = new Date(league.start);
  end.setDate(end.getDate() + 21); // 4th Monday
  end.setHours(23, 59, 0, 0);
  return end;
}
function getLeagueStatus(league, now) {
  now = now || new Date();
  if (now < league.start) return 'upcoming';
  if (now <= leagueSeasonEnd(league)) return 'in-progress';
  return 'completed';
}
function pickFeaturedLeague() {
  const now = new Date();
  return FEATURED_LEAGUES.find(l => getLeagueStatus(l, now) === 'upcoming') || null;
}
function activeFeaturedLeagues() {
  const now = new Date();
  return FEATURED_LEAGUES.filter(l => getLeagueStatus(l, now) !== 'upcoming');
