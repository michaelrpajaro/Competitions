<script>
/* ════════════════════════════════════════════════════════════════
   COMPUTED LEAGUE STANDINGS ENGINE
   ────────────────────────────────────────────────────────────────
   Why this exists: the Audi TT Cup / AACC standings used to be
   hand-typed HTML rows. That's slow to update and easy to get
   wrong. This engine computes standings from raw race results
   (the same S1_RESULTS data that already powers the "View Results"
   modal) using the published points system:
     Finish points: 1st=14, 2nd=12, 3rd=10, 4th=7, 5th=6, 6th=5,
                    7th=4, 8th=3, 9th=2, 10th=1
     Bonuses: +1 for pole position (once per week), +1 for fastest
              lap in EACH race that week.

   IMPORTANT — frozen historical baseline: spot-checking this
   formula against the already-published Audi Week 1 standings
   turned up a 1-point discrepancy (DJ Hamilton shows 25, the
   formula gives 24) that isn't explainable from the visible race
   data — most likely a small manual correction made when the
   table was first typed up. Rather than silently recompute and
   shift already-published totals (which could reorder a
   tiebreaker drivers have already seen), LEAGUE_STANDINGS below
   freezes every week that's already been published exactly as
   shown. The formula only takes over for NEW weeks you add after
   this point, and merges cleanly into the same driver list/totals.
   ════════════════════════════════════════════════════════════════ */

const LEAGUE_POINTS_TABLE = [14,12,10,7,6,5,4,3,2,1];

const LEAGUE_STANDINGS = {
  audi: {
    weeksTotal: 5,
    lockedWeeks: 5, // season complete — every week here is frozen/published
    drivers: [
      { name:'DJ Hamilton', perWeek:[25,null,30,29,31], badges:[
        {label:'🏆 CHAMPION', tooltip:'Champion — wins tiebreaker (6 wins vs 2)', bg:'rgba(255,206,74,0.25)', color:'#ffce4a', pad:8, weight:900},
        {label:'POLE ×4', tooltip:'4 Pole Positions (W1, W3, W4, W5)', bg:'rgba(255,206,74,0.15)', color:'#ffce4a'},
      ]},
      { name:'Victor Mendez', perWeek:[22,30,20,19,24], badges:[
        {label:'−2', tooltip:'Penalty applied W1', bg:'rgba(239,68,68,0.18)', color:'#ef6b6b'},
      ]},
      { name:'Shane Cook', perWeek:[11,18,12,20,17], badges:[
        {label:'POLE', tooltip:'Pole Position W2', bg:'rgba(255,206,74,0.15)', color:'#ffce4a'},
        {label:'+5s', tooltip:'Time Penalty W3 R2', bg:'rgba(239,68,68,0.18)', color:'#ef6b6b'},
      ]},
      { name:'Justin Torrente', perWeek:[null,20,12,12,16], badges:[
        {label:'+5s', tooltip:'Time Penalty W3 R2', bg:'rgba(239,68,68,0.18)', color:'#ef6b6b'},
      ]},
      { name:'Jordan Farrell', perWeek:[null,9,25,21,null], badges:[] },
      { name:'Jonas Acevedo', perWeek:[26,19,10,null,null], badges:[] },
      { name:'Stuart Stolarz Jr.', perWeek:[12,10,5,10,13], badges:[] },
      { name:'M Moueed Haider Mirza', perWeek:[12,11,10,8,null], badges:[] },
      { name:'Andrew Jones', perWeek:[4,5,2,6,10], badges:[] },
      { name:'Stephanie Egusquiza', perWeek:[9,7,5,null,null], badges:[] },
      { name:'Christian Swartz', perWeek:[6,null,null,null,null], badges:[] },
      { name:'Lucas Klein', perWeek:[1,null,null,null,null], badges:[] },
    ],
  },
  aacc: {
    weeksTotal: 5,
    lockedWeeks: 4, // week 5 (finale) hasn't been raced yet — will compute automatically once added
    drivers: [
      { name:'Clifford Loncar', perWeek:[7,12,14,14,null], badges:[] },
      { name:'Matthew Tavormina', perWeek:[16,16,8,null,null], badges:[
        {label:'POLE ×3', tooltip:'Pole W1, W2 & W3', bg:'rgba(255,206,74,0.15)', color:'#ffce4a'},
      ]},
      { name:'Tyler Yaccarino', perWeek:[12,6,10,11,null], badges:[] },
      { name:'Louis Rivieccio', perWeek:[6,5,12,12,null], badges:[] },
      { name:'Michael Colucci', perWeek:[5,7,7,7,null], badges:[] },
      { name:'Manuel Rodriguez', perWeek:[10,10,null,null,null], badges:[] },
      { name:'Sergio Sciortino', perWeek:[4,4,null,null,null], badges:[] },
      { name:'Rick Gostissa', perWeek:[3,null,null,null,null], badges:[] },
    ],
  },
  /* New/future leagues start empty — as soon as you give me results for
     their first week, they get an entry here (or I add one when I process
     your screenshot) and this engine renders their standings automatically
     from that point on, same as Audi/AACC do for weeks past lockedWeeks. */
  'lotus-gtc': { weeksTotal: 4, lockedWeeks: 0, drivers: [] },
};

function computeWeekPoints(weekData){
  const pts = {}; const names = {};
  function addPts(driverRaw, p){
    if(!driverRaw) return;
    const k = nameKey(driverRaw);
    pts[k] = (pts[k]||0) + p;
    names[k] = normalizeName(driverRaw);
  }
  function pointsForRace(raceObj){
    if(!raceObj || !raceObj.rows) return;
    raceObj.rows.forEach((row, idx) => {
      const pos = idx + 1;
      const p = LEAGUE_POINTS_TABLE[pos-1] || 0;
      if(p) addPts(row[1], p);
    });
    if(raceObj.fl && raceObj.fl.rows && raceObj.fl.rows.length){
      addPts(raceObj.fl.rows[0][1], 1);
    }
  }
  pointsForRace(weekData.race1);
  pointsForRace(weekData.race2);
  if(weekData.quali && weekData.quali.rows && weekData.quali.rows.length){
    addPts(weekData.quali.rows[0][1], 1);
  }
  return { pts, names };
}

function mergeComputedWeeks(leagueKey){
  const cfg = LEAGUE_STANDINGS[leagueKey];
  if(!cfg) return;
  const results = window.S1_RESULTS && window.S1_RESULTS[leagueKey];
  if(!results) return;
  for(let w = cfg.lockedWeeks + 1; w <= cfg.weeksTotal; w++){
    const wd = results[w];
    if(!wd || !wd.race1) continue; // no real results posted for this week yet
    const { pts, names } = computeWeekPoints(wd);
    Object.keys(pts).forEach(k => {
      let driver = cfg.drivers.find(d => nameKey(d.name) === k);
      if(!driver){
        driver = { name: names[k], perWeek: new Array(cfg.weeksTotal).fill(null), badges: [] };
        cfg.drivers.push(driver);
      }
      driver.perWeek[w-1] = pts[k];
    });
  }
}

function leagueBadgeHtml(b){
  return `<span title="${b.tooltip}" style="display:inline-block;background:${b.bg};color:${b.color};font-size:0.62em;font-weight:${b.weight||800};letter-spacing:1px;padding:2px ${b.pad||6}px;border-radius:4px;margin-left:6px;vertical-align:middle;">${b.label}</span>`;
}
function renderStandingsTable(leagueKey, containerId){
  const cfg = LEAGUE_STANDINGS[leagueKey];
  const container = document.getElementById(containerId);
  if(!cfg || !container) return;
  const list = cfg.drivers.map(d => ({ ...d, total: d.perWeek.reduce((s,v)=>s+(v||0),0) }))
    .sort((a,b) => b.total - a.total);
  const cols = `42px 1fr ${'44px '.repeat(cfg.weeksTotal)}64px`;
  const posColor = i => i===0?'#ffce4a':i===1?'#e2e6ea':i===2?'#e0954d':'#999';
  const rowBg = i => i===0?'background:linear-gradient(90deg,rgba(122,95,18,0.18),transparent 80%);'
                    : i===1?'background:linear-gradient(90deg,rgba(180,185,190,0.14),transparent 80%);'
                    : i===2?'background:linear-gradient(90deg,rgba(94,58,28,0.22),transparent 80%);' : '';
  const rows = list.map((d,i) => {
    const isLast = i === list.length-1;
    const weekCells = d.perWeek.map(v => `<div style="text-align:center;font-family:'Barlow',sans-serif;font-size:0.9em;color:${v?'#aaa':'#666'};">${v!=null?v:'—'}</div>`).join('');
    const badges = d.badges.map(leagueBadgeHtml).join(' ');
    return `<div style="display:grid;grid-template-columns:${cols};align-items:center;padding:13px 22px;${isLast?'':'border-bottom:1px solid #1a1a1a;'}${rowBg(i)}">
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.3em;font-weight:900;color:${posColor(i)};">${i+1}</div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.05em;font-weight:800;color:white;">${d.name}${badges?' '+badges:''}</div>
      ${weekCells}
      <div style="text-align:right;font-family:'Barlow Condensed',sans-serif;font-size:1.5em;font-weight:900;color:white;">${d.total}</div>
    </div>`;
  }).join('');
  container.innerHTML = rows || `<div style="padding:30px;text-align:center;font-family:'Barlow',sans-serif;font-size:0.85em;color:#555;">No results yet.</div>`;
}

mergeComputedWeeks('audi');
mergeComputedWeeks('aacc');

/* ════════════════════════════════════════════════════════════════
   VIEW LAPS/RESULTS — "League Results" mode
   Individual/League toggle lives in the View Laps/Results section
   (frag-01f); this builds the league picker + reuses the same
   renderStandingsTable()/openResultsModal() the Leagues page uses,
   just rendered into a different container.
   ════════════════════════════════════════════════════════════════ */
function leagueDisplayName(key){
  const feat = FEATURED_LEAGUES.find(l => l.slug === key);
  if(feat) return feat.name;
  if(key === 'audi') return 'Audi TT Cup';
  if(key === 'aacc') return 'AACC';
  return key;
}
/* Audi TT Cup and AACC (All American Corvette Club) are the two
   currently-running leagues — flagged here so View Laps/Results can
   call that out now that the Leagues page no longer shows an
   "Active Leagues" carousel of its own. */
const VR_ACTIVE_LEAGUES = ['audi','aacc'];
function activeLeagueBadge(key){
  return VR_ACTIVE_LEAGUES.includes(key)
    ? `<span style="display:inline-flex;align-items:center;gap:5px;background:rgba(34,197,94,0.15);color:#22c55e;font-family:'Barlow Condensed',sans-serif;font-size:0.6em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:3px 9px;border-radius:10px;margin-left:8px;vertical-align:middle;"><span style="width:6px;height:6px;background:#22c55e;border-radius:50%;display:inline-block;"></span>Active</span>`
    : '';
}
function vrLeagueWeeksHtml(leagueKey){
  const results = window.S1_RESULTS && window.S1_RESULTS[leagueKey];
  if(!results) return '';
  return Object.keys(results).map(Number).sort((a,b)=>a-b).map(w => {
    const wd = results[w];
    const hasResults = !!(wd.practice || wd.quali || wd.race1 || wd.race2);
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 22px;border-bottom:1px solid #161616;cursor:pointer;" onclick="openResultsModal('${leagueKey}',${w})" onmouseover="this.style.background='#151515'" onmouseout="this.style.background='transparent'">
      <div><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.65em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#EF4444;margin-bottom:2px;">Wk ${w}${wd.date ? ' &middot; ' + wd.date : ''}</div><div style="font-family:'Barlow Condensed',sans-serif;font-size:0.95em;font-weight:800;color:white;">${wd.track || 'TBA'}</div></div>
      <div style="font-family:'Barlow Condensed',sans-serif;font-size:0.72em;font-weight:700;color:#EF4444;white-space:nowrap;">${hasResults ? 'View Results &rsaquo;' : 'Pending'}</div>
    </div>`;
  }).join('');
}
function renderVrLeague(leagueKey){
  document.querySelectorAll('#vr-league-tabs button').forEach(b => {
    const active = b.dataset.league === leagueKey;
    b.style.background = active ? 'var(--red)' : 'transparent';
    b.style.color = active ? '#fff' : '#888';
  });
  const rowsId = 'vr-standings-rows-' + leagueKey;
  const weeksHtml = vrLeagueWeeksHtml(leagueKey);
  document.getElementById('vr-league-content').innerHTML = `
    <div style="background:#0d0d0d;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;margin-bottom:24px;">
      <div style="background:#111;padding:18px 22px;border-bottom:1px solid #1a1a1a;">
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.1em;font-weight:900;text-transform:uppercase;color:white;letter-spacing:1px;">${leagueDisplayName(leagueKey)} &middot; Standings${activeLeagueBadge(leagueKey)}</div>
      </div>
      <div id="${rowsId}"></div>
    </div>
    <div style="background:#0d0d0d;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;">
      <div style="background:#111;padding:14px 22px;border-bottom:1px solid #1a1a1a;font-family:'Barlow Condensed',sans-serif;font-size:0.75em;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#888;">Race Results by Week</div>
      ${weeksHtml || `<div style="padding:30px;text-align:center;font-family:'Barlow',sans-serif;font-size:0.85em;color:#555;">No weeks posted yet.</div>`}
    </div>`;
  renderStandingsTable(leagueKey, rowsId);
}
function initVrLeagueTabs(){
  Object.keys(LEAGUE_STANDINGS).forEach(mergeComputedWeeks);
  const keys = Object.keys(LEAGUE_STANDINGS).filter(k => LEAGUE_STANDINGS[k].drivers.length > 0);
  const tabsEl = document.getElementById('vr-league-tabs');
  const contentEl = document.getElementById('vr-league-content');
  if(!tabsEl || !contentEl) return; // View Laps/Results section not on this build
  if(!keys.length){
    tabsEl.innerHTML = '';
    contentEl.innerHTML = `<div style="padding:40px;text-align:center;font-family:'Barlow',sans-serif;font-size:0.9em;color:#555;">No league results posted yet.</div>`;
    return;
  }
  tabsEl.innerHTML = keys.map((k,i) => `<button data-league="${k}" onclick="renderVrLeague('${k}')" style="background:${i===0?'var(--red)':'transparent'};color:${i===0?'#fff':'#888'};border:1px solid var(--border);padding:10px 20px;border-radius:7px;font-family:'Barlow Condensed',sans-serif;font-size:0.9em;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;">${leagueDisplayName(k)}${activeLeagueBadge(k)}</button>`).join('');
  renderVrLeague(keys[0]);
}
initVrLeagueTabs();

/* Individual Results / League Results mode toggle for View Laps/Results. */
function vrModeTab(mode){
  const modes = ['individual','league'];
  modes.forEach(m => {
    document.getElementById('vr-mode-' + m).style.display = (m === mode) ? '' : 'none';
    const btn = document.getElementById('vr-mode-tab-' + m);
    if(m === mode){ btn.style.background = '#EF4444'; btn.style.color = '#fff'; }
    else { btn.style.background = 'transparent'; btn.style.color = '#888'; }
  });
  window.scrollTo(0, document.getElementById('sec-viewresults').offsetTop - 60);
}
</script>
