<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitions — SIM1Racing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════
   SIM1RACING — COMPETITIONS PAGE (simplified, single scroll)
   One continuous page, no section nav/router. Structure:
     1. Hero — welcome + "there's more than casual driving"
     2. Five feature rows, one per way to compete (text + photo,
        alternating sides) — Sprint Race, Friday Night Showdown,
        Qualifiers, Monthly Championship, Car Meet Competitions
     3. League interest signup (mailto: form — leagues are paused)
     4. Footer
   ════════════════════════════════════════════════════════════════ */
:root{
  --red:#EF4444; --bg:#000; --bg2:#0a0a0a; --card:#111; --card2:#0d0d0d;
  --border:#2a2a2a; --border2:#1a1a1a;
  --cond:'Barlow Condensed',sans-serif; --body:'Barlow',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{margin:0;background:var(--bg);color:#fff;font-family:var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden;}
a{color:inherit;}
h1,h2,h3{margin:0;}
img{max-width:100%;}

.btn{display:inline-block;background:var(--red);color:#fff;padding:14px 32px;border-radius:8px;font-family:var(--cond);font-size:1em;font-weight:800;text-decoration:none;text-transform:uppercase;letter-spacing:1px;border:none;cursor:pointer;transition:filter .15s,transform .1s;}
.btn:hover{filter:brightness(1.12);}
.btn:active{transform:scale(.98);}

/* ── HERO ── */
.hero{padding:110px 40px 70px;background:var(--bg);position:relative;overflow:hidden;text-align:center;}
.hero-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(239,68,68,0.16) 0%,transparent 70%);pointer-events:none;}
.hero-inner{position:relative;z-index:1;max-width:820px;margin:0 auto;}
.badge{display:inline-block;background:var(--red);color:#fff;font-family:var(--cond);font-size:11px;font-weight:800;letter-spacing:3px;text-transform:uppercase;padding:5px 18px;border-radius:14px;}
.hero h1{font-family:var(--cond);font-size:4em;font-weight:900;text-transform:uppercase;color:#fff;line-height:0.98;margin:18px 0 22px;}
.hero h1 .accent{color:var(--red);}
.hero p{font-family:var(--body);font-size:1.14em;line-height:1.7;color:#b0b0b0;margin:0;}

/* ── FEATURE ROWS — text on one side, photo on the other ── */
.sf-section{padding:66px 40px;}
.sf-row{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center;}
.sf-reverse .sf-text{order:2;}
.sf-reverse .sf-photo{order:1;}
.sf-text{font-family:var(--body);color:#b0b0b0;}
.sf-eyebrow{font-family:var(--cond);font-size:0.75em;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px;}
.sf-h2{font-family:var(--cond);font-size:2.5em;font-weight:900;text-transform:uppercase;color:white;margin:0 0 14px;line-height:1;}
.sf-p{font-size:1.02em;line-height:1.65;margin:0 0 20px;}
.sf-facts{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.sf-fact{background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:10px 16px;}
.sf-fact .fv{font-family:var(--cond);font-size:1.15em;font-weight:900;color:var(--red);line-height:1;}
.sf-fact .fl{font-family:var(--body);font-size:0.68em;color:#777;text-transform:uppercase;letter-spacing:0.6px;margin-top:3px;}
.sf-link{display:inline-block;font-family:var(--cond);font-size:0.95em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--red);text-decoration:none;border-bottom:2px solid rgba(239,68,68,0.4);padding-bottom:2px;transition:border-color .2s,color .2s;}
.sf-link:hover{border-bottom-color:currentColor;}
.sf-photo{aspect-ratio:4/3;width:100%;border-radius:12px;overflow:hidden;background:#111;border:1px solid var(--border);}
.sf-photo img{width:100%;height:100%;object-fit:cover;display:block;}
.sf-soon{position:relative;}
.sf-soon-tag{position:absolute;top:14px;left:14px;background:rgba(0,0,0,0.75);border:1px solid rgba(255,255,255,0.25);color:#fff;font-family:var(--cond);font-size:0.68em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:6px;}

/* ── LEAGUE SIGNUP ── */
.sf-signup{padding:70px 40px;background:var(--bg2);border-top:1px solid var(--border2);border-bottom:1px solid var(--border2);}
.sf-signup-wrap{max-width:640px;margin:0 auto;text-align:center;}
.sf-form{margin-top:30px;display:flex;flex-direction:column;gap:14px;text-align:left;}
.sf-field label{display:block;font-family:var(--cond);font-size:0.72em;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:#888;margin-bottom:6px;}
.sf-field input{width:100%;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:13px 14px;font-family:var(--body);font-size:0.98em;color:#fff;outline:none;transition:border-color .15s;}
.sf-field input:focus{border-color:var(--red);}
.sf-form-note{font-family:var(--body);font-size:0.8em;color:#666;margin-top:4px;}
.sf-form-status{font-family:var(--body);font-size:0.85em;color:#22c55e;margin-top:4px;display:none;}

/* ── FOOTER ── */
.footer{padding:44px 40px;background:var(--bg2);border-top:1px solid var(--border);text-align:center;}
.footer .f1{font-family:var(--cond);font-weight:900;text-transform:uppercase;letter-spacing:1px;color:#fff;font-size:1.1em;}
.footer .f2{font-family:var(--body);font-size:0.8em;color:#555;margin-top:8px;line-height:1.6;}
.footer-links{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px;}
.btn-sm{padding:9px 18px;font-size:0.82em;border-radius:7px;}
.btn-outline{background:transparent;border:2px solid #333;}

@media(max-width:900px){
  .hero h1{font-size:3em;}
  .sf-row{grid-template-columns:1fr;gap:26px;}
  .sf-reverse .sf-text,.sf-reverse .sf-photo{order:initial;}
}
@media(max-width:600px){
  .hero{padding:70px 20px 46px;}
  .hero h1{font-size:2.2em;}
  .hero p{font-size:1em;}
  .sf-section{padding:46px 18px;}
  .sf-h2{font-size:1.9em;}
  .sf-signup{padding:50px 20px;}
}
</style>
</head>
<body>

<a id="top"></a>
