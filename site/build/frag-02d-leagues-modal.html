<!-- ── RESULTS MODAL (shared by Audi + AACC cards) ── -->
<div id="resultsModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.88);backdrop-filter:blur(4px);padding:20px;overflow-y:auto;" onclick="if(event.target===this)closeResultsModal()">

</div>
</div>

<style>
