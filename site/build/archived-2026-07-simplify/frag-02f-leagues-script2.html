<script>
renderFeaturedLeague(pickFeaturedLeague());

/* Homepage "Sign Up Now" spotlight card — reuses whichever league
   pickFeaturedLeague() already decided is open for signup, so this
   never drifts out of sync with the Leagues page itself. */
function renderHomeLeagueSpotlight(){
  const el = document.getElementById('home-league-spotlight');
  if(!el) return;
  const league = pickFeaturedLeague();
  if(!league){
    el.innerHTML = `<div class="spotlight-body" style="justify-content:center;text-align:center;">
      <div class="spotlight-eyebrow">LEAGUES</div>
      <div class="spotlight-title">A New Season, Every Month</div>
      <p class="spotlight-sub">Check the Leagues page for what's running right now.</p>
      <div class="spotlight-cta" style="justify-content:center;">
        <a onclick="goToSection(event,'sec-leagues')" href="#sec-leagues" class="btn">VIEW LEAGUES</a>
      </div>
    </div>`;
    return;
  }
  const startLabel = league.start.toLocaleDateString('en-US', { month: 'long', day: 'numeric' });
  const imgStyle = league.heroImage
    ? `background-image:url('${league.heroImage}');`
    : `background:linear-gradient(150deg,#160606,#1a1a1a 60%,#0a0a0a);`;
  el.innerHTML = `
    <div class="spotlight-img" style="${imgStyle}"></div>
    <div class="spotlight-body">
      <div class="spotlight-eyebrow">MONTHLY LEAGUE</div>
      <div class="spotlight-title">${league.name}</div>
      <div class="spotlight-meta">${league.car} &middot; 4 Weeks &middot; Starts ${startLabel}</div>
      <p class="spotlight-sub">Every Monday night for four weeks, chase points toward the championship. Free for Gold Members, ${league.priceNonMember} for everyone else.</p>
      <div class="spotlight-cta">
        <a href="${league.signupUrl}" class="btn">SIGN UP NOW</a>
        <a onclick="goToSection(event,'sec-leagues')" href="#sec-leagues" class="spotlight-link">Learn more →</a>
      </div>
    </div>`;
}
renderHomeLeagueSpotlight();
</script>
