<!-- ════════════════════════════════════════════════════════════════
  SECTION: LEAGUES — auto-rotating "next season" signup promo
  + the Active Leagues carousel (Audi TT Cup, AACC, and any league
  whose season has started). Everything about WHICH league is
  "featured" vs "active" is computed from FEATURED_LEAGUES (see
  script below) based on today's date — no manual swapping needed
  once you add a new season to that array.
════════════════════════════════════════════════════════════════ -->
<div id="sec-leagues" style="width:100%;position:relative;overflow-x:hidden;">
<a class="back-home" onclick="goToSection(event,'home')" href="#home">← All Competitions</a>

<div style="max-width:1200px;margin:34px auto 0;padding:0 40px;">
  <div id="lg-toggle-row" style="display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;">
    <div style="display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:10px;padding:5px;width:fit-content;">
      <button onclick="lgModeTab('monthly')" id="lg-mode-tab-monthly" style="background:var(--red);color:#fff;border:none;padding:10px 26px;border-radius:7px;font-family:var(--cond);font-size:0.98em;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;">Monthly Leagues</button>
      <div class="lg-host-hover" tabindex="0">
        <button onclick="lgModeTab('custom')" id="lg-mode-tab-custom" style="background:transparent;color:#888;border:none;padding:10px 26px;border-radius:7px;font-family:var(--cond);font-size:0.98em;font-weight:800;text-transform:uppercase;letter-spacing:1px;cursor:pointer;">Host Your Own</button>
        <div class="lg-host-expand">
          <div class="lg-host-expand-t">Want Your Own Private Season?</div>
          <div class="lg-host-expand-d">Pick your car, your tracks, and your schedule — we'll run a custom league just for your group. Click to get started →</div>
        </div>
      </div>
    </div>
    <a onclick="goToSection(event,'sec-viewresults');vrModeTab('league');" href="#sec-viewresults" style="font-family:var(--cond);font-size:0.85em;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--red);text-decoration:none;white-space:nowrap;">View League Standings →</a>
  </div>
</div>

<div id="lg-mode-monthly">

<!-- FEATURED (UPCOMING) LEAGUE — fully rendered by JS from FEATURED_LEAGUES -->
<div id="lg-featured"></div>
