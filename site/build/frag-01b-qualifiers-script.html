function normalizeName(raw) {
  if (!raw) return '';
  const trimmed = raw.trim();
  const lower = trimmed.toLowerCase();
  if (NAME_ALIASES[lower]) return NAME_ALIASES[lower];
  return trimmed.replace(/\b\w/g, c => c.toUpperCase()).replace(/\B\w/g, c => c.toLowerCase());
}
function nameKey(name) { return normalizeName(name).toLowerCase(); }
function isStaff(name) {
  const k = nameKey(name);
  return STAFF_LIST.some(s => k === s || k.startsWith(s + ' ') || k.endsWith(' ' + s) || k === s.split(' ')[0]);
}
function isSIM1Team(name) {
  const k = nameKey(name);
  return SIM1_TEAM.some(t => nameKey(t) === k);
}

function formatLap(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  const sf = s.toFixed(3);
  return m + ':' + (s < 10 ? '0' + sf : sf);
}
function generateResults(totalCount, notable, baseLapSec, increment, baseLaps) {
  const notableMap = {};
  notable.forEach(n => { notableMap[n.pos] = normalizeName(n.driver); });
  const usedDrivers = new Set(notable.map(n => nameKey(n.driver)));
  const pool = FAKE_DRIVERS.filter(d => !usedDrivers.has(nameKey(d)));
  let fi = 0;
  const results = [];
  for (let i = 1; i <= totalCount; i++) {
    const v = ((i * 17 + 3) % 20) * 0.004;
    const lapSec = baseLapSec + (i - 1) * increment + v;
    const gap = i === 1 ? 'LEADER' : '+' + (lapSec - baseLapSec).toFixed(3);
    const laps = Math.max(4, (baseLaps || 14) - Math.floor((i - 1) / Math.max(1, Math.ceil(totalCount / 4))));
    const driver = notableMap[i] || normalizeName(pool[fi++ % pool.length]);
    results.push({ pos: i, driver, lap: formatLap(lapSec), laps, gap });
  }
  return results;
}
